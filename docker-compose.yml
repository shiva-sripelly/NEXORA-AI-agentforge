services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
    ports: ["5432:5432"]
    volumes: [agentforge_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-production}
      FRONTEND_URL: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-groq}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      MAX_CHAT_HISTORY_MESSAGES: ${MAX_CHAT_HISTORY_MESSAGES:-20}
      MAX_CHAT_MESSAGE_LENGTH: ${MAX_CHAT_MESSAGE_LENGTH:-10000}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000/api"}
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  agentforge_data:
