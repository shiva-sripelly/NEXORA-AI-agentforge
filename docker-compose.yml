services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
    ports: ["5432:5432"]
    volumes: [agentforge_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-groq}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      MAX_CHAT_HISTORY_MESSAGES: ${MAX_CHAT_HISTORY_MESSAGES:-20}
      MAX_CHAT_MESSAGE_LENGTH: ${MAX_CHAT_MESSAGE_LENGTH:-10000}
      DEFAULT_EMBEDDING_PROVIDER: ${DEFAULT_EMBEDDING_PROVIDER:-sentence_transformers}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: "384"
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-10}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      DOCUMENT_STORAGE_PATH: storage/documents
      MCP_FILE_ROOT: storage/mcp_workspace
      MCP_SERVER_ROOT: /app/mcp_servers
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_STEP_TIMEOUT_SECONDS: ${AGENT_STEP_TIMEOUT_SECONDS:-60}
      AGENT_MAX_REPLANS: ${AGENT_MAX_REPLANS:-1}
      APPROVAL_EXPIRY_MINUTES: ${APPROVAL_EXPIRY_MINUTES:-30}
      TOOL_APPROVAL_RISK_THRESHOLD: ${TOOL_APPROVAL_RISK_THRESHOLD:-high}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [document_storage:/app/storage/documents, mcp_workspace:/app/storage/mcp_workspace, embedding_cache:/root/.cache/huggingface]
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000/api"}
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  agentforge_data:
  document_storage:
  embedding_cache:
  mcp_workspace:
